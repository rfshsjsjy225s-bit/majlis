<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مجلس | MAJLIS</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#121212;--card:#1d1d1f;--gold:#c9a45c;--tx:#ece9e2;--mut:#8a8780;--ok:#5a9e78;--err:#c26a6a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px Tajawal,sans-serif;height:100dvh}
h1{font-family:Amiri,serif;color:var(--gold);margin:0}
.c{max-width:380px;margin:12vh auto;padding:24px;background:var(--card);border-radius:18px;text-align:center}
input,button,select{font:inherit;width:100%;padding:12px;margin:6px 0;border-radius:12px;border:1px solid #333;background:#101010;color:var(--tx)}
button{background:var(--gold);color:#111;font-weight:700;border:0;cursor:pointer}button.g{background:#2a2a2d;color:var(--tx)}
#app{display:none;height:100dvh;grid-template-columns:260px 1fr}#side{background:var(--card);padding:12px;overflow:auto}
#main{display:flex;flex-direction:column;height:100dvh}#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:75%;padding:9px 13px;border-radius:14px;background:#26262a;align-self:flex-start;word-break:break-word}
.m.me{background:#3a3220;align-self:flex-end}.u{padding:11px;border-radius:10px;cursor:pointer}.u:hover,.u.on{background:#2a2a2d}
#bar{display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}#bar button{width:90px}
#err{color:var(--err);min-height:1.3em;font-size:14px}small{color:var(--mut)}
@media(max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr}#side{max-height:30dvh}#main{height:auto}}
</style></head><body>
<div class="c" id="auth"><h1>مجلس | MAJLIS</h1><small>مساحة خاصة للتواصل الآمن</small>
<input id="un" placeholder="اسم المستخدم (للتسجيل فقط)"><input id="em" type="email" placeholder="البريد الإلكتروني" dir="ltr">
<input id="pw" type="password" placeholder="كلمة المرور (8 أحرف+)" dir="ltr"><div id="err"></div>
<button onclick="login()">دخول</button><button class="g" onclick="signup()">طلب انضمام</button></div>
<div id="app"><div id="side"><h1>مجلس</h1><small id="me"></small><div id="own"></div><div id="list"></div>
<button class="g" onclick="sb.auth.signOut().then(()=>location.reload())">خروج</button></div>
<div id="main"><div id="msgs"><small>اختر شخصاً لبدء محادثة مشفرة 🔒</small></div>
<div id="bar"><input id="tx" placeholder="اكتب رسالة…" onkeydown="if(event.key=='Enter')send()"><button onclick="send()">إرسال</button></div></div></div>
<script>
const SB_URL='https://jpfomcjxhodmekxwiayy.supabase.co',SB_KEY='sb_publishable_aXTEsnvvsApfk_lnZnb8bg_FZ688Qdk'; // لا تضع service_role أبداً
const sb=supabase.createClient(SB_URL,SB_KEY),$=i=>document.getElementById(i),enc=new TextEncoder(),dec=new TextDecoder();
let me,priv,peer,peerKey,chan;
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const err=t=>$('err').textContent=t||'';
async function signup(){const{error}=await sb.auth.signUp({email:$('em').value,password:$('pw').value,options:{data:{username:$('un').value.trim()}}});
 err(error?error.message:'تم إرسال الطلب. انتظر موافقة المالك ثم ادخل.')}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});if(error)return err(error.message);init()}
async function initKeys(){ // مفتاح الجهاز يُولَّد محلياً ولا يغادر الجهاز
 let j=localStorage.getItem('majlis_k_'+me.id);
 if(!j){const k=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
  const pub=b64(await crypto.subtle.exportKey('raw',k.publicKey));
  localStorage.setItem('majlis_k_'+me.id,JSON.stringify(await crypto.subtle.exportKey('jwk',k.privateKey)));
  await sb.from('profiles').update({public_key:pub}).eq('id',me.id);j=localStorage.getItem('majlis_k_'+me.id)}
 priv=await crypto.subtle.importKey('jwk',JSON.parse(j),{name:'ECDH',namedCurve:'P-256'},false,['deriveKey'])}
async function shared(pubB64){const pub=await crypto.subtle.importKey('raw',ub(pubB64),{name:'ECDH',namedCurve:'P-256'},false,[]);
 return crypto.subtle.deriveKey({name:'ECDH',public:pub},priv,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function init(){
 const{data:{user}}=await sb.auth.getUser();if(!user)return;
 const{data:p}=await sb.from('profiles').select('*').eq('id',user.id).single();me=p;
 if(!p.approved){err('حسابك بانتظار موافقة المالك.');await sb.auth.signOut();return}
 await initKeys();$('auth').style.display='none';$('app').style.display='grid';$('me').textContent=p.username+(p.role=='owner'?' (المالك)':'');
 await users();chan=sb.channel('m').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'recipient_id=eq.'+me.id},r=>{if(peer&&r.new.sender_id==peer.id)show(r.new)}).subscribe()}
async function users(){const{data}=await sb.from('profiles').select('*');
 $('list').innerHTML='';$('own').innerHTML='';
 data.filter(u=>u.id!=me.id).forEach(u=>{
  if(!u.approved){if(me.role=='owner'){const d=document.createElement('div');d.innerHTML=`<small>طلب: ${esc(u.username)}</small><button onclick="appr('${u.id}',true)">قبول</button><button class="g" onclick="appr('${u.id}',false)">رفض</button>`;$('own').append(d)}return}
  const d=document.createElement('div');d.className='u';d.textContent=u.username+(u.public_key?'':' (لم يفعّل التشفير بعد)');d.onclick=()=>open(u,d);$('list').append(d)})}
const esc=s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
async function appr(id,ok){await sb.rpc('approve_user',{uid:id,ok});users()}
async function open(u,el){if(!u.public_key)return alert('هذا العضو لم يسجّل دخوله بعد على جهازه.');
 document.querySelectorAll('.u').forEach(x=>x.classList.remove('on'));el.classList.add('on');peer=u;peerKey=await shared(u.public_key);
 const{data}=await sb.from('messages').select('*').or(`and(sender_id.eq.${me.id},recipient_id.eq.${u.id}),and(sender_id.eq.${u.id},recipient_id.eq.${me.id})`).order('created_at');
 $('msgs').innerHTML='';for(const m of data)await show(m)}
async function show(m){const d=document.createElement('div');d.className='m'+(m.sender_id==me.id?' me':'');
 try{d.textContent=dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(m.iv)},peerKey,ub(m.ciphertext)))}catch{d.textContent='⚠️ تعذّر فك التشفير';d.style.color='var(--err)'}
 $('msgs').append(d);$('msgs').scrollTop=1e9}
async function send(){const t=$('tx').value.trim();if(!t||!peer)return;$('tx').value='';
 const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},peerKey,enc.encode(t));
 const{data,error}=await sb.from('messages').insert({sender_id:me.id,recipient_id:peer.id,iv:b64(iv),ciphertext:b64(ct)}).select().single();
 if(error)return alert(error.message);show(data)}
sb.auth.getSession().then(({data})=>data.session&&init());
</script></body></html>
